name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The project lives in the MEMORA/ subfolder (match its exact capitalization).
defaults:
  run:
    working-directory: MEMORA

jobs:
  test-and-build:
    name: Test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show project files
        run: ls -la

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Upload production build
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: memora-dist
          path: MEMORA/dist
          if-no-files-found: error
          retention-days: 7
